name: Build ImmortalWrt 25.x for NRadio C8-688

on:
  # 1. 允许在 GitHub 网页端手动触发构建
  workflow_dispatch:
  # 2. 定时构建：北京时间每周三凌晨 03:00 (UTC 每周二 19:00)
  schedule:
    - cron: '0 19 * * 2'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: c8-688.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    # 授予 Release 创建与清理所需的写权限
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space (Maximize Runner Storage)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -y
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools python3-dev rsync unzip zlib1g-dev file wget ccache libfuse-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -h

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b$REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ================= 1. CCache 编译对象持久化缓存 =================
    - name: Cache CCache
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('c8-688.config') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ hashFiles('c8-688.config') }}-${{ runner.os }}-ccache-

    - name: Load Custom Feeds (diy-part1.sh)
      run: |
        [ -e $DIY_P1_SH ] && chmod +x $DIY_P1_SH && ./$DIY_P1_SH

    - name: Update & Install Feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration (diy-part2.sh)
      run: |
        [ -e $DIY_P2_SH ] && chmod +x $DIY_P2_SH && ./$DIY_P2_SH

    - name: Load Config & Generate .config
      working-directory: ./openwrt
      run: |
        if [ -e $GITHUB_WORKSPACE/$CONFIG_FILE ]; then
          cp $GITHUB_WORKSPACE/$CONFIG_FILE .config
        fi
        echo "CONFIG_DEVEL=y" >> .config
        echo "CONFIG_CCACHE=y" >> .config
        make defconfig

    # ================= 2. 交叉工具链持久化缓存 (Toolchain Cache) =================
    - name: Cache Toolchain & Host Tools
      uses: actions/cache@v4
      id: toolchain-cache
      with:
        path: |
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/staging_dir/host*
        key: ${{ runner.os }}-toolchain-${{ hashFiles('openwrt/toolchain/**', 'openwrt/tools/**') }}-${{ hashFiles('c8-688.config') }}
        restore-keys: |
          ${{ runner.os }}-toolchain-${{ hashFiles('openwrt/toolchain/**', 'openwrt/tools/**') }}-${{ runner.os }}-toolchain-

    - name: Fast Multi-thread Download
      working-directory: ./openwrt
      run: |
        make download -j16
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Optimized Compile Firmware
      id: compile
      working-directory: ./openwrt
      run: |
        export CCACHE_DIR=/workdir/openwrt/.ccache
        export CCACHE_MAXSIZE=2G
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=6
        ccache -z
        THREADS=$(($(nproc) * 2))
        echo "Optimized compile threads: $THREADS"
        make -j$THREADS || make -j1 V=s
        ccache -s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Prepare Artifacts & OTA Files
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        
        # 彻底清除 BL2 引导文件、内核镜像调试包、buildinfo 及 profile 元数据
        rm -f *initramfs* *kernel.bin *-bl2.bin *.buildinfo profiles.json *.manifest
        
        BUILD_VER="$(date +%Y.%m.%d-%H%M)"
        echo "$BUILD_VER" > version.txt
        echo "BUILD_VER=$BUILD_VER" >> $GITHUB_ENV
        
        # 仅针对最终有用的 sysupgrade 固件包生成清晰的哈希校验
        sha256sum *sysupgrade.bin > sha256sums.txt
        
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: ImmortalWrt-C8-688-${{ env.BUILD_VER }}
        path: |
          ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
          ${{ env.FIRMWARE_PATH }}/sha256sums.txt
          ${{ env.FIRMWARE_PATH }}/version.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: ${{ env.BUILD_VER }}
        name: NRadio C8-688 固件版本 ${{ env.BUILD_VER }}
        draft: false
        prerelease: false
        make_latest: true
        body: |
          ## NRadio C8-688 ImmortalWrt Master (Kernel 6.12) 固件发布
          * 源码仓库: [AA9skillz-BN/nradio-c8-688-25.x](https://github.com/AA9skillz-BN/nradio-c8-688-25.x)
          * 构建时间: ${{ env.BUILD_VER }}
          * 默认管理后台: `192.168.66.1`
          * 引导目标: 副系统 (System B: `kernel_2nd` + `rootfs_2nd`)
          * Wi-Fi 名称: `NRadio-C8-688-2.4G` / `NRadio-C8-688-5G` (160MHz 满血)
          * 加速状态: MTK PPE 硬件转发 + FullCone NAT + BBR 拥塞控制
          * 支持在 LuCI 后台【系统】->【在线更新】进行 OTA 升级
        files: |
          ${{ env.FIRMWARE_PATH }}/*sysupgrade.bin
          ${{ env.FIRMWARE_PATH }}/sha256sums.txt
          ${{ env.FIRMWARE_PATH }}/version.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ================= 3. 自动清理历史 Release，仅保留最新 3 个 =================
    - name: Delete Older Releases
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}