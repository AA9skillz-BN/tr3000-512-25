name: Build ImmortalWrt 25.x for Cudy TR3000 512MB

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: openwrt-mod/config/minimum.config
  DIY_P1_SH: Actions-OpenWrt/diy-part1.sh
  DIY_P2_SH: Actions-OpenWrt/diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. 深度清理磁盘空间
    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    # 2. 初始化环境，配置 10GB Swap 与 12GB tmpfs 内存盘
    - name: Initialization environment & Mount tmpfs
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
        libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
        libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build psmisc python3 python3-pyelftools python3-setuptools \
        qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
        zlib1g-dev clang llvm lld
        sudo timedatectl set-timezone "$TZ"

        # 挂载 10G Swap 缓冲，防止内存盘爆满
        sudo fallocate -l 10G /swapfile_ram
        sudo chmod 600 /swapfile_ram
        sudo mkswap /swapfile_ram
        sudo swapon /swapfile_ram

        # 挂载 12G tmpfs 内存盘加速磁盘 IO
        sudo mkdir -p /workdir $CCACHE_DIR
        sudo mount -t tmpfs -o size=12G tmpfs /workdir
        sudo chown -R $USER:$GROUPS /workdir $CCACHE_DIR

    # 3. 浅克隆主干源码到内存盘
    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 4. 加载 feeds 与第三方依赖
    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # 5. 加载配置并注入 512MB 补丁与物理级剔除 llvm-bpf
    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig

    # 6. 安全缓存 dl 源码包（Key 加 v2 规避之前的坏包缓存）
    - name: Cache OpenWrt dl directory
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-v2-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-v2-

    # 7. 缓存 ccache 编译器中间件
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-openwrt-ccache-v2-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-v2-

    # 8. 高速预下载源码包并清理一切损坏的 tar 归档（彻底解决 tar 损坏退出问题）
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j16
        
        # 1. 删除小于 1KB 的残损文件
        find dl -size -1024c -exec rm -f {} \;
        
        # 2. 逐一验证所有 tar 压缩包完整性，损坏的包就地抹除
        for file in dl/*.tar.* dl/*.tgz; do
          if [ -f "$file" ]; then
            tar -tf "$file" >/dev/null 2>&1 || {
              echo "::warning::Corrupt archive detected and removed: $file"
              rm -f "$file"
            }
          fi
        done
        
        # 3. 针对被清理的残缺包补救重新下载
        make download -j8

    # 9. 编译固件（前置修复 libubox 并满载构建）
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        ccache -M $CCACHE_MAXSIZE
        ccache -z
        
        # 1. 彻底清除 libubox 残留，杜绝脏补丁/坏解压
        rm -rf build_dir/target-aarch64_cortex-a53_musl/libubox*
        rm -f dl/libubox*
        
        # 2. 单独重下并预编译 libubox，输出完整详细日志
        echo "=== Pre-compiling package/libs/libubox ==="
        make package/libs/libubox/download V=s
        make package/libs/libubox/compile -j1 V=s
        
        NPROC=$(nproc)
        echo "Using $((NPROC + 1)) parallel threads for full build..."
        
        # 3. 满载构建整体固件
        make -j$((NPROC + 1)) || make -j1 V=s
        
        echo "=== Ccache Hit Rate Statistics ==="
        ccache -s
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # 10. 整理固件产物
    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # 11. 上传构件 Artifacts
    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_Cudy_TR3000_512MB${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    # 12. 发布固件到 Release
    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "ImmortalWrt 25.x for Cudy TR3000 512MB" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*cudy_tr3000*
          ${{ env.FIRMWARE }}/*.buildinfo
          ${{ env.FIRMWARE }}/*.manifest
          ${{ env.FIRMWARE }}/*sha256sums
