name: Build ImmortalWrt (VIKINGYFY 25.x / 512M)

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    # 国际标准时间(UTC) 每周二 20:00 -> 即北京时间每周三凌晨 04:00 自动运行
    - cron: '0 20 * * 2'

env:
  REPO_URL: https://github.com/VIKINGYFY/immortalwrt.git
  REPO_BRANCH: owrt
  FEEDS_CONF: Actions-OpenWrt/feeds.conf.default
  CONFIG_FILE: openwrt-mod/.config
  DIY_P1_SH: Actions-OpenWrt/diy-part1.sh
  DIY_P2_SH: Actions-OpenWrt/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y $(cat Actions-OpenWrt/depends.txt 2>/dev/null || echo "ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev")
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        # 1. 先执行 diy-part2.sh 将 cudy_tr3000-512m 机型注入 Makefile 与 DTS 目录
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH || true

        # 2. 注入完成后再拷贝 .config，确保 make defconfig 时能正确识别设备符号
        cd $GITHUB_WORKSPACE
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config

    - name: Download package
      id: package
      run: |
        cd openwrt
        # 重置其他同芯片机型声明，确保只锁定 cudy_tr3000-512m
        sed -i 's/CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y/CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512m=y/g' .config 2>/dev/null || true
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512m=y" >> .config
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_cudy_tr3000-512m" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        mkdir -p /tmp/firmware_out
        cd openwrt/bin/targets/*/*
        
        # 优先提取专属固件、sysupgrade 镜像与哈希校验表
        cp -f *cudy_tr3000-512m*.bin /tmp/firmware_out/ 2>/dev/null || true
        cp -f *sysupgrade.bin /tmp/firmware_out/ 2>/dev/null || true
        cp -f sha256sums /tmp/firmware_out/ 2>/dev/null || true
        
        # 安全兜底：如果未命中特定文件名，拷贝全部 bin 镜像防止空包
        if [ -z "$(ls -A /tmp/firmware_out 2>/dev/null)" ]; then
            echo "Fallback copy: copying all bin files."
            cp -f *.bin /tmp/firmware_out/ 2>/dev/null || true
            cp -f sha256sums /tmp/firmware_out/ 2>/dev/null || true
        fi
        
        echo "FIRMWARE=/tmp/firmware_out" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "🚀 Cudy TR3000 (512MB Flash) 专属固件发布" >> release.txt
        echo "--------------------------------------------------" >> release.txt
        echo "• 源码分支: VIKINGYFY/immortalwrt (owrt 25.x)" >> release.txt
        echo "• 默认后台: 192.168.6.1" >> release.txt
        echo "• 硬件分区: U-Boot 请选择 mod-490 布局" >> release.txt
        echo "• 预置功能: 中兴 F50 免驱 / MTK PPE硬件加速 / OpenClash 25.x 运行环境 / 专属在线更新" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete older releases (保留最新 3 个)
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      continue-on-error: true
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}