name: Build Cudy TR3000 Firmware

on:
  repository_dispatch:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      repo_source:
        description: '源码仓库'
        required: true
        default: 'VIKINGYFY/immortalwrt'
        type: choice
        options:
          - VIKINGYFY/immortalwrt
          - immortalwrt/immortalwrt
      repo_branch:
        description: '源码分支 (VIKINGYFY填 owrt，官方源填 master 或 openwrt-24.10)'
        required: true
        default: 'owrt'
        type: string
      extra_config:
        description: '临时追加的插件配置（多行按换行分隔）'
        required: false
        default: ''
        type: string
      only_config:
        description: '仅校验并输出 .config，不进行完整编译'
        required: false
        default: false
        type: boolean
      clean_release:
        description: '编译前清理历史 Release 与 Tag'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  CONFIG_FILE: openwrt-mod/config/.config
  DIY_P1_SH: Actions-OpenWrt/diy-part1.sh
  DIY_P2_SH: Actions-OpenWrt/diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean older releases before build
      uses: dev-drprasad/delete-older-releases@v0.3.3
      # 注意：schedule / repository_dispatch 触发时 github.event.inputs 为空，
      # 用 == 'true' 判断会让定时构建永远不清 release，所以这里用 != 'false'。
      if: github.event.inputs.clean_release != 'false' && github.event.inputs.only_config != 'true'
      continue-on-error: true
      with:
        keep_latest: 2
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        REPO_PATH="${{ github.event.inputs.repo_source || 'VIKINGYFY/immortalwrt' }}"
        BRANCH="${{ github.event.inputs.repo_branch || 'owrt' }}"
        
        if [ "$REPO_PATH" = "immortalwrt/immortalwrt" ] && [ "$BRANCH" = "owrt" ]; then
            BRANCH="master"
        elif [ "$REPO_PATH" = "VIKINGYFY/immortalwrt" ] && [ "$BRANCH" = "master" ]; then
            BRANCH="owrt"
        fi

        FULL_URL="https://github.com/${REPO_PATH}.git"
        git clone "$FULL_URL" -b "$BRANCH" openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
        echo "ACTUAL_REPO=$REPO_PATH" >> $GITHUB_ENV
        echo "ACTUAL_BRANCH=$BRANCH" >> $GITHUB_ENV

    - name: Load custom feeds
      run: |
        # 不要加 || true：diy-part1 内部已有 die()，失败必须中断构建，
        # 否则主题/OpenClash 会静默缺失，而 defconfig 只会默默删掉对应符号。
        chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update and Install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cd $GITHUB_WORKSPACE
        if [ -f "$CONFIG_FILE" ]; then
            echo "✔ 成功加载配置文件: $CONFIG_FILE"
            cp -f "$CONFIG_FILE" openwrt/.config
        else
            FOUND_CFG=$(find . -maxdepth 3 -name ".config" | head -n 1)
            [ -n "$FOUND_CFG" ] && cp -f "$FOUND_CFG" openwrt/.config
        fi

        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

        if [ -n "$EXTRA_CFG" ]; then
            printf "\n# --- User Extra Config ---\n%s\n" "$EXTRA_CFG" >> .config
        fi
      env:
        EXTRA_CFG: ${{ github.event.inputs.extra_config }}

    - name: Defconfig and Download packages
      id: package
      run: |
        cd openwrt
        DEVICE_CONFIG='CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-512mb-v1'
        if grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_' .config; then
            sed -i "s/^CONFIG_TARGET_mediatek_filogic_DEVICE_.*=y/${DEVICE_CONFIG}=y/" .config
        else
            echo "${DEVICE_CONFIG}=y" >> .config
        fi

        make defconfig

        # defconfig 对不存在的设备/软件包是"静默丢弃"，必须显式校验机型还在
        if ! grep -qx "${DEVICE_CONFIG}=y" .config; then
            echo "::error::目标机型 ${DEVICE_CONFIG} 未生效（设备定义缺失或被 defconfig 丢弃）"
            grep -E '^CONFIG_TARGET_.*DEVICE_' .config | head -n 20 || true
            exit 1
        fi

        # 中文语言包同样会被静默丢弃（不同 LuCI 版本后缀是 zh-cn 或 zh_Hans），
        # 一个都没留下就说明界面会整片回退英文
        if ! grep -qE '^CONFIG_PACKAGE_luci-i18n-base-zh[-_A-Za-z]*=y' .config; then
            echo "::error::中文 base 语言包未生效，界面会回退英文"
            grep -E 'CONFIG_PACKAGE_luci-i18n' .config | head -n 20 || true
            exit 1
        fi

        echo "DEVICE_NAME=_cudy_tr3000-512mb-v1" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        if [ "${{ github.event.inputs.only_config }}" = "true" ]; then
            mkdir -p /tmp/firmware_out
            cp -f .config /tmp/firmware_out/.config
            echo "FIRMWARE=/tmp/firmware_out" >> $GITHUB_ENV
            echo "ONLY_CONFIG=true" >> $GITHUB_ENV
            exit 0
        fi

        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      if: env.ONLY_CONFIG != 'true'
      run: |
        cd openwrt
        make tools/compile -j"$(nproc)" || make tools/compile -j1 V=s
        make toolchain/compile -j"$(nproc)" || make toolchain/compile -j1 V=s
        if ! make -j"$(nproc)"; then
            echo "::warning::并行编译失败，回退串行重编（耗时会长很多，请先看上面的报错）"
            make -j1 V=s
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: (steps.compile.outputs.status == 'success' || env.ONLY_CONFIG == 'true') && !cancelled()
      run: |
        mkdir -p /tmp/firmware_out
        if [ "$ONLY_CONFIG" = "true" ]; then
            cp -f openwrt/.config /tmp/firmware_out/.config
        else
            BIN_DIR=$(find openwrt/bin/targets -type f -name 'sha256sums' -printf '%h\n' | head -n 1)
            if [ -z "$BIN_DIR" ]; then
                echo "::error::未找到 openwrt/bin/targets 下的产物目录"
                exit 1
            fi
            cp -f "$BIN_DIR"/sha256sums /tmp/firmware_out/ 2>/dev/null || true
            cp -f "$BIN_DIR"/*cudy_tr3000-512mb-v1*.bin /tmp/firmware_out/ 2>/dev/null || true
            if ! ls /tmp/firmware_out/*.bin >/dev/null 2>&1; then
                echo "::error::没有生成任何 cudy_tr3000-512mb-v1 固件"
                ls -l "$BIN_DIR" || true
                exit 1
            fi
        fi
        echo "FIRMWARE=/tmp/firmware_out" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware or config to Artifacts
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.ONLY_CONFIG == 'true' && format('Checked_Config{0}{1}', env.DEVICE_NAME, env.FILE_DATE) || format('OpenWrt_firmware{0}{1}', env.DEVICE_NAME, env.FILE_DATE) }}
        path: ${{ env.FIRMWARE }}
        include-hidden-files: true

    - name: Generate release tag
      id: tag
      if: env.ONLY_CONFIG != 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=ImmortalWrt-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "🚀 Cudy TR3000 (512MB Flash) 专属固件发布" > release.txt
        echo "--------------------------------------------------" >> release.txt
        echo "• 源码仓库: ${{ env.ACTUAL_REPO }} (${{ env.ACTUAL_BRANCH }})" >> release.txt
        echo "• 默认后台: 192.168.6.1" >> release.txt
        echo "• 硬件分区: U-Boot 请选择 mod-490 布局" >> release.txt
        echo "• 预置功能: Aurora 现代主题 / OpenClash (内置 Meta 内核) / 中兴 F50 5G 即插即用 / BBR 拥塞控制 / TTL=65 防限速（已关闭 flow offload 以保证 TTL 生效）" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: env.ONLY_CONFIG != 'true' && steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
